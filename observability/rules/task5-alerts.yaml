apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: task5-alerts
  namespace: observability
  labels:
    monitoring: task5
spec:
  groups:
    - name: application.rules
      rules:
        - alert: HighErrorRate
          expr: |
            (
              sum(rate(app_http_requests_total{status=~"5.."}[5m]))
              /
              clamp_min(sum(rate(app_http_requests_total[5m])), 0.000001)
            ) > 0.05
          for: 5m
          labels:
            severity: critical
            domain: application
          annotations:
            summary: "Application 5xx error rate is high"
            description: "More than 5% of application requests are returning 5xx responses for at least 5 minutes."
            runbook_url: "runbooks/high-error-rate.md"

        - alert: HighLatencyP95
          expr: |
            histogram_quantile(
              0.95,
              sum by (le) (
                rate(app_http_request_duration_seconds_bucket[5m])
              )
            ) > 1
          for: 5m
          labels:
            severity: warning
            domain: application
          annotations:
            summary: "Application p95 latency is above SLO threshold"
            description: "Application p95 request latency has exceeded 1 second for at least 5 minutes."
            runbook_url: "runbooks/high-latency-p95.md"

    - name: kubernetes.rules
      rules:
        - alert: ReplicasMismatch
          expr: |
            (
              kube_deployment_spec_replicas{namespace="devops-app"}
              -
              kube_deployment_status_replicas_available{namespace="devops-app"}
            ) > 0
          for: 5m
          labels:
            severity: warning
            domain: kubernetes
          annotations:
            summary: "Deployment replicas do not match desired state"
            description: "At least one devops-app Deployment has fewer available replicas than desired for at least 5 minutes."
            runbook_url: "runbooks/replicas-mismatch.md"

        - alert: NodeNotReady
          expr: |
            kube_node_status_condition{
              condition="Ready",
              status="true"
            } == 0
          for: 5m
          labels:
            severity: critical
            domain: kubernetes
          annotations:
            summary: "Kubernetes node is not Ready"
            description: "A Kubernetes worker node has remained NotReady for at least 5 minutes."
            runbook_url: "runbooks/node-not-ready.md"

    - name: jenkins.rules
      rules:
        - alert: JenkinsQueueStuck
          expr: |
            default_jenkins_queue_size_value > 0
          for: 5m
          labels:
            severity: warning
            domain: jenkins
          annotations:
            summary: "Jenkins build queue is not clearing"
            description: "One or more Jenkins builds have remained queued for at least 5 minutes."
            runbook_url: "runbooks/jenkins-queue-stuck.md"

    - name: monitoring.rules
      rules:
        - alert: PrometheusTargetDown
          expr: |
            up == 0
          for: 5m
          labels:
            severity: critical
            domain: monitoring
          annotations:
            summary: "Prometheus scrape target is down"
            description: "A monitored Prometheus target has been unreachable for at least 5 minutes."
            runbook_url: "runbooks/prometheus-target-down.md"
