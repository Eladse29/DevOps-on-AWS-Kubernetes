apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-application-overview
  namespace: observability
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "Task 5"
data:
  application-overview.json: |
    {
      "id": null,
      "uid": "task5-application-overview",
      "title": "Application Overview",
      "tags": [
        "task5",
        "application",
        "observability"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "15s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "service",
            "label": "Service",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "query": {
              "query": "label_values(app_http_requests_total, service)",
              "refId": "PrometheusVariableQueryEditor-VariableQuery"
            },
            "includeAll": true,
            "allValue": ".*",
            "multi": true,
            "refresh": 1
          },
          {
            "name": "pod",
            "label": "Pod",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "query": {
              "query": "label_values(kube_pod_info{namespace=\"devops-app\"}, pod)",
              "refId": "PrometheusVariableQueryEditor-VariableQuery"
            },
            "includeAll": true,
            "allValue": ".*",
            "multi": true,
            "refresh": 1
          },
          {
            "name": "release",
            "label": "Release",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "query": {
              "query": "label_values(app_info, release)",
              "refId": "PrometheusVariableQueryEditor-VariableQuery"
            },
            "includeAll": true,
            "allValue": ".*",
            "multi": true,
            "refresh": 1
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "title": "Request Rate (RPS)",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 8,
            "h": 7
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (service) (rate(app_http_requests_total{service=~\"$service\",release=~\"$release\"}[5m]))",
              "legendFormat": "{{service}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "options": {}
        },
        {
          "id": 2,
          "title": "5xx Error Rate",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 8,
            "y": 0,
            "w": 8,
            "h": 7
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (service) (rate(app_http_requests_total{service=~\"$service\",release=~\"$release\",status=~\"5..\"}[5m]))",
              "legendFormat": "{{service}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "options": {}
        },
        {
          "id": 3,
          "title": "Availability",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 16,
            "y": 0,
            "w": 8,
            "h": 7
          },
          "targets": [
            {
              "refId": "A",
              "expr": "100 * (1 - (sum(rate(app_http_requests_total{service=~\"$service\",release=~\"$release\",status=~\"5..\"}[5m])) / clamp_min(sum(rate(app_http_requests_total{service=~\"$service\",release=~\"$release\"}[5m])), 0.000001)))",
              "legendFormat": ""
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent"
            },
            "overrides": []
          },
          "options": {}
        },
        {
          "id": 4,
          "title": "Latency p50",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 7,
            "w": 8,
            "h": 7
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.50, sum by (le, service) (rate(app_http_request_duration_seconds_bucket{service=~\"$service\",release=~\"$release\"}[5m])))",
              "legendFormat": "{{service}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "options": {}
        },
        {
          "id": 5,
          "title": "Latency p95",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 8,
            "y": 7,
            "w": 8,
            "h": 7
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.95, sum by (le, service) (rate(app_http_request_duration_seconds_bucket{service=~\"$service\",release=~\"$release\"}[5m])))",
              "legendFormat": "{{service}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "options": {}
        },
        {
          "id": 6,
          "title": "Latency p99",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 16,
            "y": 7,
            "w": 8,
            "h": 7
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.99, sum by (le, service) (rate(app_http_request_duration_seconds_bucket{service=~\"$service\",release=~\"$release\"}[5m])))",
              "legendFormat": "{{service}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "options": {}
        },
        {
          "id": 7,
          "title": "Application Release",
          "type": "table",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 14,
            "w": 8,
            "h": 6
          },
          "targets": [
            {
              "refId": "A",
              "expr": "app_info{service=~\"$service\",release=~\"$release\"}",
              "legendFormat": "{{service}} {{version}} {{git_sha}} {{release}}"
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "options": {}
        },
        {
          "id": 8,
          "title": "Machines Created",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 8,
            "y": 14,
            "w": 8,
            "h": 6
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(app_machines_created_total)",
              "legendFormat": ""
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "options": {}
        },
        {
          "id": 9,
          "title": "Application CPU",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 16,
            "y": 14,
            "w": 8,
            "h": 7
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"devops-app\",pod=~\"$pod\",container!=\"\",container!=\"POD\"}[5m]))",
              "legendFormat": "{{pod}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "cores"
            },
            "overrides": []
          },
          "options": {}
        },
        {
          "id": 10,
          "title": "Application Memory",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 21,
            "w": 8,
            "h": 7
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (pod) (container_memory_working_set_bytes{namespace=\"devops-app\",pod=~\"$pod\",container!=\"\",container!=\"POD\"})",
              "legendFormat": "{{pod}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            },
            "overrides": []
          },
          "options": {}
        },
        {
          "id": 11,
          "title": "Dependency Failures",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 8,
            "y": 21,
            "w": 8,
            "h": 7
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (dependency) (rate(app_dependency_failures_total{service=\"backend\"}[5m]))",
              "legendFormat": "{{dependency}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "options": {}
        },
        {
          "id": 12,
          "title": "Worker Business Operations",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 16,
            "y": 21,
            "w": 8,
            "h": 7
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(app_worker_process_total)",
              "legendFormat": ""
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "options": {}
        }
      ]
    }
