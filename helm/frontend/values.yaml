replicaCount: 3

image:
  repository: 904053120094.dkr.ecr.us-east-1.amazonaws.com/devops-frontend
  tag: v1
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: frontend-sa

service:
  type: LoadBalancer
  port: 80
  targetPort: 80

containerPort: 80

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

readinessProbe:
  path: /
  initialDelaySeconds: 5
  periodSeconds: 10

livenessProbe:
  path: /
  initialDelaySeconds: 15
  periodSeconds: 20

# Spread replicas across worker nodes to reduce the impact of a node failure.

topologySpreadConstraints:
  enabled: true
  maxSkew: 1
  topologyKey: kubernetes.io/hostname
  whenUnsatisfiable: DoNotSchedule

metrics:
  exporter:
    image: nginx/nginx-prometheus-exporter:1.4.1
  port: 9113
  servicePort: 9113
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

