{{/*
Sensitive values are supplied through values.local.yaml.
The local values file is excluded from Git; only the example file is committed.
*/}}

apiVersion: v1
kind: Secret
metadata:
  name: devops-secret
  labels:
    {{- include "backend.labels" . | nindent 4 }}
type: Opaque
stringData:
  DB_HOST: {{ .Values.secret.dbHost | quote }}
  DB_NAME: {{ .Values.secret.dbName | quote }}
  DB_USER: {{ .Values.secret.dbUser | quote }}
  DB_PASSWORD: {{ .Values.secret.dbPassword | quote }}
