apiVersion: v1
kind: ServiceAccount
metadata:
  name: jenkins-cd-agent
  namespace: jenkins
  labels:
    app.kubernetes.io/name: jenkins-cd-agent
    app.kubernetes.io/component: cd-agent
automountServiceAccountToken: true

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jenkins-cd-deployer
  namespace: devops-app
  labels:
    app.kubernetes.io/name: jenkins-cd-deployer
    app.kubernetes.io/component: cd-agent
rules:
  - apiGroups:
      - ""
    resources:
      - pods
      - pods/log
      - services
      - configmaps
      - secrets
      - serviceaccounts
      - events
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete

  - apiGroups:
      - apps
    resources:
      - deployments
      - replicasets
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete

  - apiGroups:
      - networking.k8s.io
    resources:
      - ingresses
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-cd-deployer
  namespace: devops-app
  labels:
    app.kubernetes.io/name: jenkins-cd-deployer
    app.kubernetes.io/component: cd-agent
subjects:
  - kind: ServiceAccount
    name: jenkins-cd-agent
    namespace: jenkins
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: jenkins-cd-deployer