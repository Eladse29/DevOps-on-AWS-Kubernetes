# Non-sensitive example values for the Jenkins Helm installation.
#
# The active installation uses:
#   jenkins/values.yaml
#
# No passwords, tokens, AWS access keys or application secrets
# should be stored in this file.

controller:
  image:
    registry: docker.io
    repository: jenkins/jenkins
    tag: "2.568.1-jdk21"
    pullPolicy: IfNotPresent

  replicas: 1
  numExecutors: 0
  executorMode: EXCLUSIVE
  disableRememberMe: true

  admin:
    username: admin
    createSecret: true

  serviceEnabled: true
  serviceType: ClusterIP
  servicePort: 8080
  targetPort: 8080

  resources:
    requests:
      cpu: 250m
      memory: 768Mi
    limits:
      cpu: "1"
      memory: 1536Mi

  installPlugins:
    - kubernetes:4540.v612369217f87
    - workflow-aggregator:608.v67378e9d3db_1
    - git:5.10.1
    - configuration-as-code:2111.v475308a_6c93b_
    - job-dsl:3654.vdf58f53e2d15
    - github:1.47.0
    - junit:1416.vd753e036de5e
    - ws-cleanup:0.49
    - credentials-binding:728.v902a_273b_8947
    - plain-credentials:199.v9f8e1f741799

persistence:
  enabled: true
  storageClass: jenkins-ebs
  accessMode: ReadWriteOnce
  size: 8Gi

rbac:
  create: true
  readSecrets: false

serviceAccount:
  create: true
  name: jenkins-controller
  automountServiceAccountToken: true

networkPolicy:
  enabled: false