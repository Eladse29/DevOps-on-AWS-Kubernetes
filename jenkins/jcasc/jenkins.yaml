jenkins:
  systemMessage: |
    DevOps on AWS - Final Project / Task 5
    Jenkins is configured and managed as code.
    CI and CD run on dynamic Kubernetes agent Pods.

credentials:
  system:
    domainCredentials:
      - credentials:
          - file:
              scope: GLOBAL
              id: backend-values-local
              fileName: values.local.yaml
              secretBytes: "${jenkins-backend-values-backend-values-base64}"
              description: Backend Helm values for the CD Pipeline

jobs:
  - file: /var/jenkins_home/casc_configs/jobs.groovy