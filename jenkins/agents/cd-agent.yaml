- name: cd-agent
  label: jenkins-cd
  serviceAccount: jenkins-cd-agent
  idleMinutes: 0
  instanceCap: 1
  yamlMergeStrategy: override
  yaml: |-
    apiVersion: v1
    kind: Pod
    metadata:
      labels:
        app.kubernetes.io/name: jenkins-cd-agent
        app.kubernetes.io/component: cd-agent
    spec:
      serviceAccountName: jenkins-cd-agent
      automountServiceAccountToken: true
      restartPolicy: Never
    
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
    
      containers:
        - name: jnlp
          image: jenkins/inbound-agent:3384.v60d89463d9e0-1-jdk21
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: workspace
              mountPath: /home/jenkins/agent
            - name: tmp
              mountPath: /tmp
    
        - name: helm
          image: alpine/helm:3.21.0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
          args:
            - cat
          tty: true
          workingDir: /home/jenkins/agent
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: workspace
              mountPath: /home/jenkins/agent
            - name: helm-cache
              mountPath: /home/jenkins/.cache
            - name: helm-config
              mountPath: /home/jenkins/.config
            - name: tmp
              mountPath: /tmp
    
        - name: kubectl
          image: bitnami/kubectl:1.35.0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
          args:
            - cat
          tty: true
          workingDir: /home/jenkins/agent
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: workspace
              mountPath: /home/jenkins/agent
            - name: tmp
              mountPath: /tmp
    
        - name: curl
          image: curlimages/curl:8.16.0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
          args:
            - cat
          tty: true
          workingDir: /home/jenkins/agent
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: workspace
              mountPath: /home/jenkins/agent
            - name: tmp
              mountPath: /tmp
    
      volumes:
        - name: workspace
          emptyDir: {}
    
        - name: helm-cache
          emptyDir: {}
    
        - name: helm-config
          emptyDir: {}
    
        - name: tmp
          emptyDir: {}